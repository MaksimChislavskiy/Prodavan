name: Deploy Prodavan

on:
  workflow_dispatch:
  push:
    branches:
      - develop

concurrency:
  group: prodavan-deploy
  cancel-in-progress: true

env:
  BACKEND_IMAGE: maxwell884/prodavan-backend:develop
  FRONTEND_IMAGE: maxwell884/prodavan-frontend:develop
  DEPLOY_DIR: prodavan-deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}
          build-args: |
            VITE_API_URL=/api

      - name: Copy compose to server
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
        run: |
          set -e

          SSH_PORT="${SERVER_SSH_PORT:-22}"

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/prodavan_deploy_key
          chmod 600 ~/.ssh/prodavan_deploy_key

          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/prodavan_deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p ~/${DEPLOY_DIR}"

          scp -i ~/.ssh/prodavan_deploy_key -P "$SSH_PORT" docker-compose.deploy.yaml "$SSH_USER@$SSH_HOST:~/${DEPLOY_DIR}/docker-compose.deploy.yaml"

      - name: Restart containers on server
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
        run: |
          set -e

          SSH_PORT="${SERVER_SSH_PORT:-22}"

          ssh -i ~/.ssh/prodavan_deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -e
            cd ~/${DEPLOY_DIR}
            if docker ps >/dev/null 2>&1; then
              DOCKER='docker'
            else
              DOCKER='sudo docker'
            fi
            \$DOCKER compose -f docker-compose.deploy.yaml pull
            \$DOCKER compose -f docker-compose.deploy.yaml up -d --remove-orphans
            \$DOCKER compose -f docker-compose.deploy.yaml ps
          "
