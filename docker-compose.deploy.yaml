x-backend-worker: &backend-worker
  image: maxwell884/prodavan-backend:develop
  restart: unless-stopped
  env_file:
    - .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings
  depends_on:
    backend:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    container_name: prodavan_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - prodavan_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: prodavan_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: maxwell884/prodavan-backend:develop
    container_name: prodavan_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
    volumes:
      - prodavan_media:/app/media
      - prodavan_static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    image: maxwell884/prodavan-frontend:develop
    container_name: prodavan_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - prodavan_media:/media:ro
      - prodavan_static:/static:ro
    depends_on:
      backend:
        condition: service_healthy

  telegram_webhook_worker:
    <<: *backend-worker
    command:
      [
        "python",
        "manage.py",
        "process_telegram_webhooks",
        "--watch",
        "--limit",
        "1000",
        "--poll-interval",
        "1"
      ]

  outgoing_messages_worker:
    <<: *backend-worker
    command:
      [
        "python",
        "manage.py",
        "process_outgoing_messages",
        "--watch",
        "--limit",
        "1000",
        "--poll-interval",
        "1"
      ]

  ai_automation_worker:
    <<: *backend-worker
    command:
      [
        "python",
        "manage.py",
        "process_ai_automation_events",
        "--watch",
        "--limit",
        "1000",
        "--poll-interval",
        "1"
      ]

  ai_autopilot_worker:
    <<: *backend-worker
    command:
      [
        "python",
        "manage.py",
        "process_ai_autopilot_jobs",
        "--watch",
        "--limit",
        "1000",
        "--poll-interval",
        "1"
      ]

  knowledge_worker:
    <<: *backend-worker
    command:
      [
        "python",
        "manage.py",
        "process_knowledge_documents",
        "--watch",
        "--limit",
        "100",
        "--poll-interval",
        "1"
      ]
    volumes:
      - prodavan_media:/app/media

  auth_email_worker:
    <<: *backend-worker
    command:
      [
        "python",
        "manage.py",
        "process_auth_emails",
        "--watch",
        "--limit",
        "100",
        "--poll-interval",
        "1"
      ]

  maintenance_worker:
    <<: *backend-worker
    command:
      [
        "python",
        "manage.py",
        "run_maintenance_worker",
        "--watch",
        "--notification-interval",
        "60",
        "--telegram-interval",
        "300",
        "--ai-session-interval",
        "300",
        "--auth-cleanup-interval",
        "86400"
      ]

volumes:
  prodavan_pg_data:
  prodavan_media:
  prodavan_static:
