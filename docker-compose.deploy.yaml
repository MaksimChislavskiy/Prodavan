services:
  db:
    image: postgres:16-alpine
    container_name: prodavan_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - prodavan_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: prodavan_redis
    restart: unless-stopped

  backend:
    image: maxwell884/prodavan-backend:develop
    container_name: prodavan_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.deploy_settings
    volumes:
      - prodavan_media:/app/media
      - prodavan_static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"

  frontend:
    image: maxwell884/prodavan-frontend:develop
    container_name: prodavan_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - prodavan_media:/media:ro
      - prodavan_static:/static:ro
    depends_on:
      - backend

volumes:
  prodavan_pg_data:
  prodavan_media:
  prodavan_static:
